name: Documentation
on:
  push:
    branches:
      - master
      - main
  pull_request:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (GitHub)
        uses: actions/checkout@v4
        with:
          path: "./ditl"

      - name: Move repostiory to home
        run: |
            mv $GITHUB_WORKSPACE/ditl /home/runner/work/ditl
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.14"
          python-version: 3.14
          working-directory: $GITHUB_WORKSPACE/ditl

      - name: Install Python dependencies
        working-directory: /home/runner/work/ditl
        run: |
            uv sync --group docs

      - run: uv run zensical build --clean
        working-directory: /home/runner/work/ditl

      - uses: actions/upload-artifact@v4
        with:
          name: docs-preview
          path: /home/runner/work/ditl/site
  deploy:
    if: github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v6
      - name: Checkout (GitHub)
        uses: actions/checkout@v4
        with:
          path: "./ditl"

      - name: Move repostiory to home
        run: |
            mv $GITHUB_WORKSPACE/ditl /home/runner/work/ditl
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.14"
          python-version: 3.14
          working-directory: $GITHUB_WORKSPACE/ditl

      - name: Install Python dependencies
        working-directory: /home/runner/work/ditl
        run: |
            uv sync --group docs
      - run: uv run zensical build --clean
        working-directory: /home/runner/work/ditl

      - uses: actions/upload-pages-artifact@v5
        with:
          path: /home/runner/work/ditl/site
      - uses: actions/deploy-pages@v5
        id: deployment

