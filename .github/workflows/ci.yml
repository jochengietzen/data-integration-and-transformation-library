name: 'ci' 
on:
  pull_request:

jobs:
  quality-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (GitHub)
        uses: actions/checkout@v4

      - name: Ensure SSH and gitconfig exist
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          touch ~/.gitconfig

      # - uses: devcontainers/ci@v0.3
      #   with:
      #     imageName: ghcr.io/${{ github.repository }}-devcontainer
      #     runCmd: |
      #       uv run pytest
      #       uv run ruff check .

      - name: Run style & code checks
        uses: devcontainers/ci@v0.3
        with:
          cacheFrom: ghcr.io/jochengietzen/ditl-devcontainer
          push: never
          runCmd: just check
  
  unit-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
          python: ["3.10", "3.11", "3.12", "3.13" ]
          os: [ ubuntu-latest, macos-latest, windows-latest ]
    defaults:
      run:
          shell: bash
          
    steps:
      - name: Checkout (GitHub)
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.7.15"
          python-version: ${{ matrix.python }}

      - name: Install command runner
        uses: taiki-e/install-action@just

      - name: Install Python dependencies
        run: |
            uv sync --all-groups

      - name: Run unit-tests
        run: |
            just unit-tests
